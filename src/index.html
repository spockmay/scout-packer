<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="preconnect" href="https://jsdelivr.net">
    <link rel="dns-prefetch" href="https://jsdelivr.net">
    <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="ScoutPacker: A smart, weather-driven gear checklist tool for Scouts. Pin your location and dates to get automated packing recommendations based on real-time forecasts.">    
    <meta name="theme-color" content="#2E5A27">
    <title>ScoutPacker</title>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">    

    <!-- Leaflet Core Styles (Minified & Asynchronous) -->
    <link rel="preload" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.min.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
    <noscript><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.min.css"></noscript>

    <!-- Leaflet Geocoder Plugin Styles (Minified & Asynchronous) -->
    <link rel="preload" href="https://cdn.jsdelivr.net/npm/leaflet-control-geocoder@2.4.0/dist/Control.Geocoder.min.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
    <noscript><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet-control-geocoder@2.4.0/dist/Control.Geocoder.min.css"></noscript>

    <!-- Font Awesome Free Icons (Minified & Asynchronous) -->
    <link rel="preload" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
    <noscript><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"></noscript>

    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header role="banner" class="site-banner">
        <div class="banner-content">
            <img src="icon-40.png" width="40" height="40" alt="ScoutPacker Logo" fetchpriority="high">
            <span class="banner-text">ScoutPacker</span>
        </div>
        <i id="settingsGear" onclick="toggleSettings()" class="fas fa-cog"></i>
    </header>
    <main role="main">
        <!-- The Hidden Settings Panel -->
        <div id="settingsPanel">
            <!-- Preferences Menu: Always-Add items -->
            <div>
                <h3>Personal "Always-Add" Gear</h3>
                <p><small>These items will be added to every packing list you generate.</small></p>
                <div class="input-group">
                    <input type="text" id="alwaysAddInput" placeholder="e.g., Asthma Inhaler, Pocket Knife">
                    <button onclick="saveAlwaysAddItem()" class="btn-main btn-add">Add</button>
                </div>
                <ul id="alwaysAddList"></ul>
            </div>
            <!-- Preferences Menu: About Me Section -->
            <hr>
            <div class="preferences-section">
                <h3>About Me</h3>
                <label for="user-role-select">I am packing as a:</label>
                <select id="user-role-select" class="pref-dropdown">
                    <option value="cub">Cub Scout</option>
                    <option value="scout" selected>Scout</option>
                    <option value="adult">Adult Leader / Parent</option>
                </select>
            </div>
        </div>

        <div class="input-group">
            <label for="startDate">Departure Date</label>
            <input type="date" id="startDate" name="startDate">
            <label for="endDate">Return Date</label>
            <input type="date" id="endDate" name="endDate">
        </div>

        <div id="map" style="height: 300px; width: 100%; border-radius: 8px; margin-bottom: 10px;"></div>

        <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.min.js" defer></script>
        <script src="https://cdn.jsdelivr.net/npm/leaflet-control-geocoder@2.4.0/dist/Control.Geocoder.min.js" defer></script>

        <div id="tripTitleDisplay"></div>

        <div class="trip-controls">
            <button id="generateBtn">Generate Packing List</button>
            <button id="printPdfBtn" class="btn-icon" title="Print to PDF" style="display:none;" onclick="window.print()">
                <i class="fas fa-print"></i>
            </button>
            <button id="clearBtn" class="btn-icon btn-danger" title="Clear All" style="display:none;">
                <i class="fas fa-trash-can"></i>
            </button>   
        </div>   

        <div id="weather-alerts"></div>
        <div class="flex-container">
            <div id="precipChance"></div>
            <div id="forecast"></div>
        </div>
        <div><p id="gearContainer" style="text-align: center;">To generate your packing list, select the trip dates and location!</p></div>
        <div id="quick-add-container">
            <div id="quick-append-group">
                <input type="text" id="custom-item-input" placeholder="Add a one-time item (e.g., Swimsuit)...">
                <button class="quick-add-btn" onclick="addOneTimeItem()">Add</button>
            </div>
        </div>
        <div><p id="errorMessage"></p></div>
    </main>
   
    <footer role="contentinfo">
        <div id="footer">
            <hr>
            <a href="https://buymeacoffee.com/spockmay" target="_blank">Buy Me a Coffee</a>
            <br>©2026 | <a href="privacy.html" target="_blank">Your Data</a> | <a href="mailto:ryan@scoutpacker.com?subject=feedback" target="_blank">Bug or Idea?</a>
            <div id="app-version">Loading version...</div>
        </div>
    </footer>
</body>

<script>
    let currentTripLocation = ""; // Global variable to store the name from the map
    let generatedGearArray = JSON.parse(localStorage.getItem('scout_gear_list') || '[]'); // Stores your smart weather/trip list items
    let aboutMe = JSON.parse(localStorage.getItem('scout_about') || '{ "camper": "scout", "fire": "true", "knife": "true" }');
    let delete_confirmed = false;

    function addOneTimeItem() {
        const inputElement = document.getElementById('custom-item-input');
        const itemText = inputElement.value.trim();

        if (!itemText) return; // Validation: Don't add empty strings

        generatedGearArray.push({ name: itemText, checked: false }); // Add to our state array

        // Save to localStorage so it persists on reload
        saveGearState(generatedGearArray);

        // Append directly to the UI list
        updateAndRenderMasterList();
        updateUIState(true);

        // Clear the input and refocus for efficiency
        inputElement.value = '';
        inputElement.focus();
    }    

    function saveAboutMe() {
        const selectedRole = document.getElementById('user-role-select').value;
        aboutMe.camper = selectedRole;
        localStorage.setItem('scout_about', JSON.stringify(aboutMe));
        console.log(`Preference saved: ${selectedRole}`);
        
        // Optional: Trigger a re-render of the packing list immediately if it's already generated
    }

    function updateAndRenderMasterList() {
        renderGearList(generatedGearArray);
    }


    function updateUIState(hasItems) {
        const clearBtn = document.getElementById('clearBtn');
        clearBtn.style.display = hasItems ? 'inline-block' : 'none';

        const printPdfBtn = document.getElementById('printPdfBtn');
        printPdfBtn.style.display = hasItems ? 'inline-block' : 'none';

        const quickAppend = document.getElementById('quick-add-container');
        quickAppend.style.display = hasItems ? 'inline-block' : 'none';            
    }

    // Function to save current state to storage
    function saveGearState(gearList) {
        localStorage.setItem('scout_gear_list', JSON.stringify(gearList));
    }

    function toggleSettings() {
        const panel = document.getElementById('settingsPanel');
        if (panel.style.display === "none" || panel.style.display === "") {
            panel.style.display = "block";
        } else {
            panel.style.display = "none";
        }
    }

    function saveAlwaysAddItem() {
        const input = document.getElementById('alwaysAddInput');
        const newItem = input.value.trim();
        if (!newItem) return;

        let items = JSON.parse(localStorage.getItem('scoutPackerAlwaysAdd')) || [];
        items.push(newItem);
        localStorage.setItem('scoutPackerAlwaysAdd', JSON.stringify(items));
        
        input.value = '';
        displayAlwaysAddItems();
    }

    function displayAlwaysAddItems() {
        const listElement = document.getElementById('alwaysAddList');
        const items = JSON.parse(localStorage.getItem('scoutPackerAlwaysAdd')) || [];
        
        // Clean and structural HTML only
        listElement.innerHTML = items.map((item, index) => `
            <li>
                <span>${item}</span>
                <i class="fas fa-times" onclick="removeAlwaysItem(${index})" title="Remove item"></i>
            </li>
        `).join('');
    }

    function displayAboutMe() {
        document.getElementById('user-role-select').value = aboutMe.camper;
    }

    // Function to render the list with checkboxes
    function renderGearList(gearArray) {
        updateUIState(gearArray.length > 0);        

        const container = document.getElementById('gearContainer');
        container.innerHTML = ''; // Clear previous

        gearArray.forEach((item, index) => {
            const div = document.createElement('div');
            div.className = 'gear-item';
            
            // Create the checkbox
            const checkbox = document.createElement('input');
            checkbox.type = 'checkbox';
            checkbox.id = `item-${index}`;
            checkbox.checked = item.checked || false;

            // Listen for changes to save state
            checkbox.addEventListener('change', () => {
                item.checked = checkbox.checked;
                saveGearState(gearArray);
            });

            const label = document.createElement('label');
            label.htmlFor = `item-${index}`;
            label.innerText = item.name;

            const button = document.createElement('button');
            button.className = "remove-item-btn";
            button.onclick = () => removeItemFromTrip(index);
            button.innerText = '✕'


            div.appendChild(checkbox);
            div.appendChild(label);
            div.appendChild(button);

            container.appendChild(div);
        });
    }    

    function removeAlwaysItem(index) {
        let items = JSON.parse(localStorage.getItem('scoutPackerAlwaysAdd')) || [];
        items.splice(index, 1);
        localStorage.setItem('scoutPackerAlwaysAdd', JSON.stringify(items));
        displayAlwaysAddItems();
    }

    function removeItemFromTrip(masterIndex) {
        if (!delete_confirmed) {
            const userConfirmed = confirm("This will remove the item from the packing list.");

            // 2. If the user clicks "Cancel", abort execution immediately
            if (!userConfirmed) {
                return;
            } else {
                delete_confirmed = true;
            }
        } 

        const customIndex = masterIndex - generatedGearArray.length;
        generatedGearArray.splice(customIndex, 1);
        saveGearState(generatedGearArray)

        // draw the updated lists
        renderGearList(generatedGearArray);
    }    

    function updateTripName() {
        const startStr = document.getElementById('startDate').value;
        const endStr = document.getElementById('endDate').value;
        const titleElement = document.getElementById('tripTitleDisplay');

        // 1. Calculate Days
        let dayCount = 0;
        if (startStr && endStr) {
            const start = new Date(startStr);
            const end = new Date(endStr);
            // Calculate difference in milliseconds, convert to days, and add 1 for inclusivity
            const diffTime = Math.abs(end - start);
            dayCount = Math.ceil(diffTime / (1000 * 60 * 60 * 24)) + 1;
        }

        // 2. Determine Location Fallback
        const location = currentTripLocation || "Somewhere Exciting";

        // 3. Render the String
        if (dayCount > 0) {
            titleElement.innerText = `${dayCount} day trip to ${location}`;
            
            // Show the button now that the trip is valid
            generateBtn.style.display = "block";      
        } else {
            titleElement.innerText = ""; 
        
            // Hide the button if dates are cleared or invalid
            generateBtn.style.display = "none";    
        }

        // 4. Subtle pulse animation
        titleElement.classList.remove('title-update-pulse');
        void titleElement.offsetWidth; // Trigger reflow to restart animation
        titleElement.classList.add('title-update-pulse');
    }

    async function displayCacheVersion() {
        const versionDisplay = document.getElementById('app-version');
        if (!versionDisplay) return;

        try {
            // Get all cache keys (names) from the browser
            const cacheNames = await caches.keys();
            
            if (cacheNames.length > 0) {
                // Usually, you'll want the most recent one or the one matching your prefix
                // If your cache name in sw.js is "scoutpacker-v1.0.2", this pulls it:
                const myCaches = cacheNames.filter(name => name.startsWith('scout-packer'));
                myCaches.sort().reverse(); // Put the 'highest' version at index 0
                versionDisplay.textContent = `${myCaches[0] || 'Unknown'}`;
            } else {
                versionDisplay.textContent = "Local Dev Build";
            }
        } catch (e) {
            versionDisplay.textContent = "Unknown Build";
        }
    }

    async function checkForUpdate() {
        if ('serviceWorker' in navigator) {
            const registration = await navigator.serviceWorker.getRegistration();
            if (registration) {
                registration.update();
                // alert("Checking for updates... if found, they will apply on the next refresh.");
            }
        }
    }

    // Fetches data with automatic retries and asynchronous waiting.
    async function fetchPackingListData(url, retries = 3, delay = 1500) {
        for (let i = 0; i < retries; i++) {
            try {
                const response = await fetch(url);
                
                // 1. Explicitly check if the server returned a success status (200-299)
                if (!response.ok) {
                    throw new Error(`Server returned status code ${response.status}`);
                }
                
                const data = await response.json();
                
                // 2. Validate that the critical data array actually exists in the payload
                if (!data || data.recommended_gear === undefined) {
                    throw new Error("Payload received, but recommended_gear is undefined");
                }
                
                // If everything passes, return the successful data and exit the loop
                return data;
                
            } catch (error) {
                console.warn(`Attempt ${i + 1} failed: ${error.message}`);
                
                // If this was our last attempt, throw the error out to your exception display UI
                if (i === retries - 1) throw error;
                
                // Otherwise, wait asynchronously without blocking the UI thread before trying again
                await new Promise(resolve => setTimeout(resolve, delay));
            }
        }
    }

    // This is the "Safety Catch" to make sure the map renders before we start being crazy
    document.addEventListener('DOMContentLoaded', () => {
        // register a service worker to enable full offline mode
        if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/sw.js')
            .then(() => console.log("Service Worker Registered"));
        }    
        
        // pre-load the always-add items
        displayAlwaysAddItems();
        document.getElementById('alwaysAddInput').addEventListener('keypress', function (e) {
        if (e.key === 'Enter') {
            saveAlwaysAddItem();
        }
        });

        displayAboutMe(); 

        displayCacheVersion() // display the version information
        checkForUpdate() // check for version updates & update

        function getTodayString() {
            // this is overly verbose but sadly needed to get the date in local TZ
            const d = new Date();
            const year = d.getFullYear();
            const month = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        function addDaysToDate(dateStr, days) {
            const date = new Date(dateStr);
            date.setDate(date.getDate() + days);
            return date.toISOString().split('T')[0];
        }

        // 1. Initialize the map (centered on Solon, OH)
        const HOME_COORDS = [41.388, -81.436];
        const map = L.map('map', {
            tap: false,          // Removes the 300ms legacy delay
            touchZoom: 'center', // Improves feel on mobile
            detectRetina: true,  // Sharpens tiles for PageSpeed
            maxZoom: 13,
            minZoom: 4
        }).setView(HOME_COORDS, 10);

        // Strange bug where icons are loaded from the wrong url
        delete L.Icon.Default.prototype._getIconUrl;
        L.Icon.Default.mergeOptions({
            iconRetinaUrl: 'https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/images/marker-icon-2x.png',
            iconUrl:       'https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/images/marker-icon.png',
            shadowUrl:     'https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/images/marker-shadow.png'
        });
        
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap',
            maxZoom: 13,
            tileSize: 256 // Ensures Leaflet knows the base size before scaling        
        }).addTo(map);

        // 2. Add a Draggable Marker
        let marker = L.marker(HOME_COORDS, { draggable: true }).addTo(map);

        // 3. Add the Search Box
        const geocoder = L.Control.geocoder({
            defaultMarkGeocode: false,
            collapsed: false, // This keeps the text input visible at all times
            placeholder: "Search for a campsite or town...",
        })
        .on('markgeocode', function(e) {
            const bbox = e.geocode.bbox;
            const center = e.geocode.center;
            marker.setLatLng(center);
            map.fitBounds(bbox);
            currentTripLocation = e.target._lastGeocode;
            updateTripName()
        })
        .addTo(map);

        let LAMBDA_URL = "";

        async function initializeApp() {
        try {
            // 1. Fetch the auto-generated config file
            const response = await fetch('./amplify_outputs.json');
            const outputs = await response.json();

            // 2. Extract the URL for your 'gear-engine'
            // The path in the JSON follows the name of your function
            LAMBDA_URL = outputs.custom.gearEngineUrl; 

            console.log("Systems Online. Backend connected to:", LAMBDA_URL);
        } catch (err) {
            console.error("Could not load amplify_outputs.json. Using local fallback?", err);
        }
        }

        // Run this when the script loads
        initializeApp();

        document.getElementById('generateBtn').addEventListener('click', async () => {
            const coords = marker.getLatLng(); // {lat, lng}
            const display = document.getElementById('gearContainer');
            const errBox = document.getElementById('errorMessage');

            errBox.innerText = ""

            display.innerHTML = "Consulting the forecast...";
            const date = document.getElementById('startDate').value;
            const endDate = document.getElementById('endDate').value;
            // We send the data as Query Parameters
            const url = `${LAMBDA_URL}?lat=${coords.lat}&lon=${coords.lng}&date=${date}&enddate=${endDate}&camper=${aboutMe.camper}&fire=${aboutMe.fire}&knife=${aboutMe.knife}`;

            try {
                const data = await fetchPackingListData(url, 3, 1500);

                const newGear = data.recommended_gear.map(name => ({ name, checked: false }));

                // Fetch the 'Always-Add' items from storage
                const personalGear = JSON.parse(localStorage.getItem('scoutPackerAlwaysAdd')) || [];
                const newPersonalGear = personalGear.map(name => ({ name, checked: false }));

                // Merge them (making sure personal items stand out)
                if (personalGear.length > 0) {
                    newGear.push(...newPersonalGear);
                }                

                // Merge logic: If item exists in storage, keep its status
                const saved = JSON.parse(localStorage.getItem('scout_gear_list') || '[]');
                const mergedGear = newGear.map(newItem => {
                    const existing = saved.find(s => s.name === newItem.name);
                    return existing ? existing : newItem;
                });
                generatedGearArray = mergedGear;

                document.getElementById('precipChance').innerHTML = `Greatest chance of precip: ${data.precip_prob}`;
                document.getElementById('forecast').innerHTML = `<a href=${data.forecast_url} target="_blank">Full Forecast</a>`;
                
                // display weather alert icons
                const alertContainer = document.getElementById('weather-alerts');
                alertContainer.innerHTML = data.conditions
                    .map(cond => getWeatherIconHTML(cond))
                    .join(' ');

                updateAndRenderMasterList();
                saveGearState(mergedGear);
                updateUIState(true);
            } catch (err) {
                errBox.innerText = "Error: " + err.message;
            }
        });

        // function to save the state of the app to local storage
        function saveContext() {
            const context = {
                    lat: marker.getLatLng().lat,
                    lon: marker.getLatLng().lng,
                    date: document.getElementById('startDate').value,
                    enddate: document.getElementById('endDate').value
                };
                localStorage.setItem('scout_packer_context', JSON.stringify(context));
        }

        document.getElementById('clearBtn').addEventListener('click', () => {
            // 1. Confirm the action to prevent accidental wipes
            if (confirm("Are you sure you want to clear your current packing list?")) {
                
                // 2. Wipe the specific key from localStorage
                localStorage.removeItem('scout_gear_list');
                localStorage.removeItem('scout_packer_context')
                localStorage.removeItem('scoutPackerCustomItems')
                
                // 3. Update the UI
                document.getElementById('gearContainer').innerHTML = "";
                document.getElementById('precipChance').innerHTML = "";
                document.getElementById('weather-alerts').innerHTML = "";
                document.getElementById('errorMessage').innerText = "";
                document.getElementById('tripTitleDisplay').innerText = "";
                document.getElementById('forecast').innerHTML = "";

                // 2. Reset the Date Picker
                const dateInput = document.getElementById('startDate');
                dateInput.value = ''; // Wipes the selected date
                const enddateInput = document.getElementById('endDate');
                enddateInput.value = ''; // Wipes the selected date

                // 3. Reset the Map Marker           
                if (marker) {
                    marker.setLatLng(HOME_COORDS);
                    map.flyTo(HOME_COORDS, 10); 
                }

                // 4. Update UI State (Hide the clear button)
                updateUIState(false);
                generateBtn.style.display = "none";            
              
                
                console.log("Full system reset complete.");
                }
        });

        document.getElementById('startDate').addEventListener('change', () => {
            // Ensure endDate isn't before startDate
            const startDate = document.getElementById('startDate').value;
            const endDate = document.getElementById('endDate');
            endDate.min = startDate;
            
            if ((endDate.value && endDate.value < startDate)
            || endDate.value == "") {
                endDate.value = startDate;
            }
        
            saveContext(); // Update our persistent storage
        });  

        document.getElementById('endDate').addEventListener('change', saveContext);
        document.getElementById('startDate').addEventListener('change', updateTripName);
        document.getElementById('endDate').addEventListener('change', updateTripName);
        document.getElementById('user-role-select').addEventListener('change', saveAboutMe);

        map.on('click', async function(e) {
            marker.setLatLng(e.latlng);
            saveContext(); // Save the new coordinates immediately

            const { lat, lng } = e.latlng;

                try {
                    // Adding a User-Agent is good practice for Nominatim
                    const response = await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lng}`, {
                        headers: { 'User-Agent': 'ScoutPacker-App-v1.0' }
                    });
                    const data = await response.json();
                    
                    // Priority logic: Park/Nature > Neighborhood/Suburb > City/Township
                    currentTripLocation = data.address.leisure || 
                                        data.address.park ||
                                        data.address.neighbourhood ||
                                        data.address.city || 
                                        data.address.town || 
                                        data.address.village || 
                                        ""; // Empty string triggers 'Somewhere Exciting' in updateTripName

                } catch (error) {
                    console.error("Geocoding failed:", error);
                    currentTripLocation = ""; // Fallback on network error
                }

                updateTripName();            

        });

        // load the page state if there is saved data in local storage
        window.addEventListener('load', () => {
            const savedContext = JSON.parse(localStorage.getItem('scout_packer_context'));
                if (savedContext) {
                    if (savedContext.date) document.getElementById('startDate').value = savedContext.date;
                    if (savedContext.enddate) document.getElementById('endDate').value = savedContext.enddate;
                    if (savedContext.lat && savedContext.lon) {
                        const pos = [savedContext.lat, savedContext.lon];
                        marker.setLatLng(pos);
                        map.setView(pos, 13);
                    }
                }

            const savedGear = localStorage.getItem('scout_gear_list');
            
            if (savedGear) {
                console.log("Found saved gear. Re-hydrating list...");
                const gearArray = JSON.parse(savedGear);
                renderGearList(gearArray);
            } else {
                console.log("No saved gear found. Starting fresh.");
                updateUIState(false); // Hide the clear button
            }

            // input constraints on the date pickers
            const today = getTodayString();
            document.getElementById('startDate').min = today;
            document.getElementById('startDate').max = addDaysToDate(today, 15);
            document.getElementById('endDate').min = today;
            document.getElementById('endDate').max = addDaysToDate(today, 15);

        });

        const weatherMap = {
            'rain': 'icon-rain',
            'cold': 'icon-cold',
            'dangerous cold': 'icon-danger-cold',
            'hot': 'icon-hot',
            'dangerous hot': 'icon-danger-hot',
            'high uv': 'icon-uv',
            'wind warning': 'icon-wind-warn',
            'wind hazard': 'icon-wind-haz',
            'extreme wind hazard': 'icon-wind-ex'
        };

        // Function to generate the icon HTML
        function getWeatherIconHTML(condition) {
            const className = weatherMap[condition.toLowerCase()] || '';
            if (!className) return ''; // Safety check if condition is unknown
            return `<span class="icon-weather ${className}" title="${condition}"></span>`;
        }
    }); // End of Safety Catch
</script>
</html>
